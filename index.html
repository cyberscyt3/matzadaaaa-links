<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATZADAAAA - Links</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Textos Superiores -->
      <div class="top-tags"></div>

      <!-- Coloque o caminho da sua foto de perfil no src abaixo -->
      <img src="imgs/perfil.jpeg" alt="Perfil" class="profile-pic" />

      <h1>MATZADAAAA</h1>
      <div class="subtitle">LIVES &bull; GAMES &bull; RESENHA</div>

      <!-- Botão Twitch -->
      <a
        href="https://twitch.tv/matzadaaaa"
        class="link-btn btn-twitch"
        target="_blank"
      >
        <div class="link-icon"><i class="fa-brands fa-twitch"></i></div>
        <div class="link-text">
          <span class="link-title">TWITCH</span>
          <span class="link-url">twitch.tv/matzadaaaa</span>
        </div>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Botão TikTok -->
      <a
        href="https://tiktok.com/@matzadaaaa"
        class="link-btn btn-tiktok"
        target="_blank"
      >
        <div class="link-icon"><i class="fa-brands fa-tiktok"></i></div>
        <div class="link-text">
          <span class="link-title">TIKTOK</span>
          <span class="link-url">tiktok.com/@matzadaaaa</span>
        </div>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Botão Livepix -->
      <a
        href="https://livepix.gg/matzadaaaa"
        class="link-btn btn-livepix"
        target="_blank"
      >
        <div class="link-icon"><i class="fa-solid fa-heart"></i></div>
        <div class="link-text">
          <span class="link-title">LIVEPIX</span>
          <span class="link-url">livepix.gg/matzadaaaa</span>
        </div>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Rodapé -->
      <div class="footer-text">
        <i class="fa-solid fa-bolt"></i> APOIE A LIVE E FAÇA PARTE DA TROPA!
        <i class="fa-solid fa-bolt"></i>
      </div>

      <!-- <div class="social-icons">
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
      </div> -->
    </div>
  </body>
</html>
